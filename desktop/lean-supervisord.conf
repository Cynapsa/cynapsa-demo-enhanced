[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-session]
command=/usr/local/sbin/run-codex-session
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash",CODEX_DESKTOP_CRD_ENABLED="0",LIBGL_ALWAYS_SOFTWARE="1"
priority=30
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-browser-gateway]
command=/opt/codex-desktop/remote-browser/run-gateway.sh
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/sbin/run-codex-x11vnc
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash"
priority=50
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/local/sbin/run-codex-novnc
priority=55
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:enhanced-local-gui]
command=/usr/bin/caddy run --config /opt/cynapsa-enhanced/local-gui.caddy --adapter caddyfile
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",XDG_DATA_HOME="/home/codex/.local/share",XDG_CONFIG_HOME="/home/codex/.config"
priority=65
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
